<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B1220">
<title>Gestão da Qualidade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=Archivo+Narrow:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0B1220; --ink2:#16213B; --ink3:#243257;
  --indigo:#4F46E5; --indigo-d:#4338CA; --indigo-soft:#EEF2FF;
  --canvas:#F6F7FB; --card:#FFFFFF; --line:#E4E7F0; --line2:#EDF0F7;
  --text:#111827; --muted:#6B7280; --muted2:#9AA3B2;
  --ok:#16A34A; --bom:#2563EB; --reg:#D97706; --ruim:#DC2626;
  --critica:#DC2626; --maior:#EA580C; --menor:#CA8A04;
  --r:14px; --sh:0 1px 2px rgba(16,24,40,.04), 0 8px 24px -12px rgba(16,24,40,.18);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif;
  background:var(--canvas); color:var(--text);
  -webkit-font-smoothing:antialiased; font-size:14px; line-height:1.45;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:inherit}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}

/* ---------- shell ---------- */
.app{display:flex;min-height:100vh}
.sidebar{
  width:246px;flex:0 0 246px;background:var(--ink);color:#fff;
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh;
}
.brand{padding:18px 16px 16px;border-bottom:1px solid rgba(255,255,255,.08);display:flex;align-items:center;gap:8px}
.sbtoggle{width:28px;height:28px;border-radius:8px;color:#8C97B4;display:grid;place-items:center;font-size:15px;flex:0 0 28px}
.sbtoggle:hover{background:rgba(255,255,255,.08);color:#fff}
.brand .mark{display:flex;align-items:center;gap:10px}
.brand .sq{width:30px;height:30px;border-radius:9px;background:linear-gradient(140deg,var(--indigo),#7C74F0);
  display:grid;place-items:center;font-weight:800;font-size:13px;letter-spacing:.5px}
.brand h1{margin:0;font-size:14.5px;font-weight:700;letter-spacing:-.2px}
.brand p{margin:2px 0 0;font-size:11px;color:#8C97B4;font-weight:500}
.nav{padding:14px 12px;flex:1;overflow:auto}
.nav .grp{width:100%;display:flex;align-items:center;gap:7px;font-family:'Archivo Narrow';font-size:10.5px;
  letter-spacing:1.3px;text-transform:uppercase;color:#6E7B9E;padding:13px 10px 7px;font-weight:600;text-align:left}
.nav .grp:hover{color:#A9B4D0}
.nav .grp .ch{font-size:9px;transition:transform .18s;display:inline-block}
.nav .grp.closed .ch{transform:rotate(-90deg)}
.nav .grp .cnt{margin-left:auto;font-size:10px;color:#55618A;letter-spacing:0}
.nav .sec{overflow:hidden}
.nav .sec.hide{display:none}
.nav button{
  width:100%;display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:10px;
  color:#C3CAE0;font-size:13.4px;font-weight:500;text-align:left;transition:.15s;margin-bottom:2px
}
.nav button:hover{background:rgba(255,255,255,.06);color:#fff}
.nav button.on{background:var(--indigo);color:#fff;font-weight:600}
.nav button .ic{width:17px;text-align:center;font-size:14px;opacity:.95}
.nav button .pill{margin-left:auto;background:rgba(255,255,255,.14);border-radius:20px;
  padding:1px 7px;font-size:11px;font-weight:700}
.nav button.on .pill{background:rgba(0,0,0,.22)}
.nav button .pill.alert{background:var(--ruim);color:#fff}
.sidefoot{padding:14px 16px;border-top:1px solid rgba(255,255,255,.08);font-size:11px;color:#6E7B9E}
/* --- modo recolhido --- */
body.sb-collapsed .sidebar{width:66px;flex:0 0 66px}
body.sb-collapsed .brand{justify-content:center;padding:18px 8px 16px}
body.sb-collapsed .brand .txt,body.sb-collapsed .brand .sq{display:none}
body.sb-collapsed .nav{padding:10px 8px}
body.sb-collapsed .nav .grp{justify-content:center;padding:12px 0 6px;font-size:0}
body.sb-collapsed .nav .grp:after{content:'';display:block;width:20px;height:1px;background:rgba(255,255,255,.12)}
body.sb-collapsed .nav .grp .ch,body.sb-collapsed .nav .grp .cnt{display:none}
body.sb-collapsed .nav .sec.hide{display:block}
body.sb-collapsed .nav button.item{justify-content:center;padding:10px 0;position:relative}
body.sb-collapsed .nav button.item .lb{display:none}
body.sb-collapsed .nav button.item .pill{position:absolute;top:3px;right:6px;margin:0;font-size:9.5px;padding:0 5px}
body.sb-collapsed .sidefoot{display:none}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{
  background:#fff;border-bottom:1px solid var(--line);padding:0 26px;height:62px;
  display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:30
}
.topbar .title{font-size:16.5px;font-weight:700;letter-spacing:-.3px}
.topbar .sub{font-size:12px;color:var(--muted);font-weight:500;margin-top:-1px}
.spacer{flex:1}
.who{display:flex;align-items:center;gap:8px;background:var(--canvas);border:1px solid var(--line);
  border-radius:11px;padding:5px 9px 5px 11px}
.who label{font-family:'Archivo Narrow';font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--muted2);font-weight:600}
.who select{border:0;background:none;font-weight:600;font-size:13px;outline:none;max-width:150px}
.bell{position:relative;width:38px;height:38px;border-radius:11px;border:1px solid var(--line);
  background:#fff;display:grid;place-items:center;font-size:16px}
.bell b{position:absolute;top:-5px;right:-5px;background:var(--ruim);color:#fff;font-size:10px;
  min-width:17px;height:17px;border-radius:9px;display:grid;place-items:center;font-weight:700;padding:0 4px}
.content{padding:24px 26px 60px;max-width:1320px;width:100%}

/* ---------- primitives ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.card .hd{padding:15px 18px;border-bottom:1px solid var(--line2);display:flex;align-items:center;gap:10px}
.card .hd h3{margin:0;font-size:13.5px;font-weight:700;letter-spacing:-.1px}
.card .hd .note{font-size:11.5px;color:var(--muted);font-weight:500}
.card .bd{padding:18px}
.grid{display:grid;gap:16px}
.eyebrow{font-family:'Archivo Narrow';font-size:10.5px;letter-spacing:1.4px;text-transform:uppercase;
  color:var(--muted2);font-weight:600}
.sect-title{font-size:15px;font-weight:700;margin:26px 0 12px;letter-spacing:-.2px;display:flex;align-items:center;gap:10px}
.sect-title:first-child{margin-top:0}

.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 15px;border-radius:10px;font-weight:600;
  font-size:13px;border:1px solid transparent;transition:.15s;white-space:nowrap}
.btn-p{background:var(--indigo);color:#fff}
.btn-p:hover{background:var(--indigo-d)}
.btn-s{background:#fff;border-color:var(--line);color:var(--text)}
.btn-s:hover{border-color:#C9CFDE;background:#FAFBFF}
.btn-d{background:var(--ink);color:#fff}
.btn-ok{background:var(--ok);color:#fff}
.btn-no{background:var(--ruim);color:#fff}
.btn-w{background:var(--reg);color:#fff}
.btn-sm{padding:6px 11px;font-size:12.3px;border-radius:9px}
.btn:disabled{opacity:.45;cursor:not-allowed}

.field{margin-bottom:14px}
.field label{display:block;font-size:12px;font-weight:600;color:#3B4557;margin-bottom:6px}
.field .hint{font-size:11.5px;color:var(--muted);font-weight:500;margin-top:5px}
input[type=text],input[type=date],input[type=number],select,textarea{
  width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:#fff;outline:none;transition:.15s
}
input:focus,select:focus,textarea:focus{border-color:var(--indigo);box-shadow:0 0 0 3px rgba(79,70,229,.12)}
textarea{resize:vertical;min-height:78px;line-height:1.5}
.row{display:grid;gap:14px}
.row-2{grid-template-columns:1fr 1fr}
.row-3{grid-template-columns:1fr 1fr 1fr}
.row-4{grid-template-columns:repeat(4,1fr)}

.tag{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;font-size:11.5px;font-weight:600}
.tag-l{background:var(--indigo-soft);color:var(--indigo-d)}
.tag-g{background:#F1F5F9;color:#475569}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block}

table{width:100%;border-collapse:collapse}
th{font-family:'Archivo Narrow';font-size:10.5px;letter-spacing:1.1px;text-transform:uppercase;color:var(--muted2);
  font-weight:600;text-align:left;padding:0 14px 9px;border-bottom:1px solid var(--line2)}
td{padding:12px 14px;border-bottom:1px solid var(--line2);font-size:13px;vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}
tbody tr.click:hover{background:#FAFBFF}
.empty{padding:44px 20px;text-align:center;color:var(--muted)}
.empty .big{font-size:30px;margin-bottom:8px;opacity:.5}
.empty p{margin:0 0 4px;font-weight:600;color:#3B4557}
.empty span{font-size:12.5px}

/* ---------- KPI ---------- */
.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px 15px;box-shadow:var(--sh)}
.kpi.click:hover{border-color:#C9CFDE;box-shadow:0 2px 4px rgba(16,24,40,.06),0 12px 26px -14px rgba(16,24,40,.28)}
.kpi .lb{font-family:'Archivo Narrow';font-size:10.5px;letter-spacing:1.1px;text-transform:uppercase;
  color:var(--muted2);font-weight:600;line-height:1.3;min-height:26px}
.kpi .vl{font-size:27px;font-weight:800;letter-spacing:-1px;margin-top:3px}
.kpi .fo{font-size:11.5px;color:var(--muted);font-weight:500;margin-top:2px}

/* ---------- gauge (assinatura) ---------- */
.gauge{display:flex;align-items:center;gap:22px}
.gauge svg{flex:0 0 auto}
.gauge .rd{font-size:44px;font-weight:800;letter-spacing:-2px;line-height:1}
.gauge .cl{font-family:'Archivo Narrow';font-size:13px;letter-spacing:2px;text-transform:uppercase;font-weight:700;margin-top:2px}

/* ---------- checklist ---------- */
.secao{display:flex;align-items:center;gap:10px;margin:22px 0 11px;font-size:13.5px;font-weight:700;color:var(--ink2)}
.secao:first-child{margin-top:4px}
.secao .bar{flex:1;height:1px;background:var(--line)}
.secao .qt{font-family:'Archivo Narrow';font-size:11px;letter-spacing:1px;color:var(--muted2);font-weight:600}
.esp{font-size:11.5px;font-weight:600;color:var(--muted);background:var(--canvas);border:1px solid var(--line);
  border-radius:20px;padding:2px 9px;white-space:nowrap}
.itemrow{border:1px solid var(--line);border-radius:12px;margin-bottom:10px;background:#fff;overflow:hidden}
.itemrow.answered{border-color:#D8DDEA}
.itemrow .top{display:flex;gap:13px;padding:14px 16px}
.itemrow .idx{font-family:'Archivo Narrow';font-weight:700;color:var(--muted2);font-size:13px;min-width:24px;padding-top:2px}
.itemrow .txt{flex:1;font-size:13.6px;font-weight:500;line-height:1.5;padding-top:1px}
.opts{display:flex;flex-wrap:wrap;gap:7px;padding:0 16px 14px 53px}
.opt{padding:6px 12px;border:1px solid var(--line);border-radius:20px;font-size:12.4px;font-weight:600;color:#5B6579;background:#fff;transition:.12s}
.opt:hover{border-color:#BFC7D9}
.opt.on[data-v=C]{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.on[data-v=NC]{background:var(--ruim);border-color:var(--ruim);color:#fff}
.opt.on[data-v=OM]{background:var(--reg);border-color:var(--reg);color:#fff}
.opt.on[data-v=NA]{background:#64748B;border-color:#64748B;color:#fff}
.ncbox{background:#FEF2F2;border-top:1px solid #FCD9D9;padding:16px 16px 16px 53px}
.ncbox .hd2{display:flex;align-items:center;gap:8px;font-weight:700;font-size:12.5px;color:#B42318;margin-bottom:12px}
.ombox{background:#FFFBEB;border-top:1px solid #FCEBC3;padding:16px 16px 16px 53px}
.ombox .hd2{display:flex;align-items:center;gap:8px;font-weight:700;font-size:12.5px;color:#92400E;margin-bottom:12px}
.prog{height:7px;background:var(--line2);border-radius:6px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--indigo);border-radius:6px;transition:.3s}
.stickybar{position:sticky;bottom:0;background:#fff;border:1px solid var(--line);border-radius:var(--r);
  padding:13px 18px;display:flex;align-items:center;gap:16px;box-shadow:0 -6px 22px -14px rgba(16,24,40,.35);margin-top:16px}

/* ---------- esteira NC (assinatura 2) ---------- */
.esteira{display:flex;align-items:stretch;gap:0;background:#fff;border:1px solid var(--line);
  border-radius:12px;overflow:hidden}
.esteira .st{flex:1;padding:11px 12px;border-right:1px solid var(--line2);position:relative;min-width:0}
.esteira .st:last-child{border-right:0}
.esteira .st .n{font-family:'Archivo Narrow';font-size:10px;letter-spacing:1.1px;color:var(--muted2);font-weight:600}
.esteira .st .t{font-size:12.2px;font-weight:600;color:#94A0B5;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.esteira .st.done{background:#F5F7FF}
.esteira .st.done .t{color:#4B5563}
.esteira .st.now{background:var(--indigo)}
.esteira .st.now .t{color:#fff}
.esteira .st.now .n{color:rgba(255,255,255,.7)}

/* ---------- misc ---------- */
.evid{width:100%;max-height:230px;object-fit:contain;border-radius:10px;border:1px solid var(--line);background:#F8FAFC;display:block}
.thumb{width:44px;height:44px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.filebtn{display:inline-flex;align-items:center;gap:7px;padding:8px 13px;border:1px dashed #C7CEDF;border-radius:10px;
  font-size:12.5px;font-weight:600;color:#4B5563;background:#fff}
.filebtn:hover{border-color:var(--indigo);color:var(--indigo-d)}
.filters{display:flex;flex-wrap:wrap;gap:9px;align-items:center;margin-bottom:14px}
.filters select,.filters input{width:auto;min-width:130px;padding:7px 10px;font-size:12.5px;border-radius:9px}

.loginwrap{position:fixed;inset:0;z-index:300;background:linear-gradient(150deg,#0B1220 0%,#16213B 55%,#243257 100%);
  display:grid;place-items:center;padding:20px;overflow:auto}
.loginbox{background:#fff;border-radius:18px;width:100%;max-width:420px;box-shadow:0 30px 70px -20px rgba(0,0,0,.55);overflow:hidden}
.loginbox .lh{padding:28px 28px 20px;text-align:center;border-bottom:1px solid var(--line2)}
.loginbox .lh .sq{width:46px;height:46px;border-radius:13px;background:linear-gradient(140deg,var(--indigo),#7C74F0);
  display:grid;place-items:center;font-weight:800;font-size:19px;color:#fff;margin:0 auto 12px}
.loginbox .lh h2{margin:0;font-size:19px;font-weight:800;letter-spacing:-.4px}
.loginbox .lh p{margin:4px 0 0;font-size:12.5px;color:var(--muted)}
.loginbox .lb{padding:22px 28px 26px}
.loginerr{background:#FEF2F2;border:1px solid #FCD9D9;color:#B42318;border-radius:10px;padding:10px 12px;
  font-size:12.5px;font-weight:600;margin-bottom:14px}
.demoacc{background:var(--canvas);border-top:1px solid var(--line2);padding:14px 28px 18px;font-size:11.8px;color:var(--muted)}
.demoacc b{color:#3B4557}
.demoacc .lin{display:flex;justify-content:space-between;gap:10px;padding:3px 0;cursor:pointer;border-radius:6px}
.demoacc .lin:hover{background:#fff}
.consulta{background:#FEF3C7;border-bottom:1px solid #FCEBC3;padding:9px 26px;display:flex;align-items:center;gap:12px;
  font-size:12.8px;font-weight:600;color:#92400E;position:sticky;top:62px;z-index:29}
.consulta .spacer{flex:1}
.saud{display:flex;flex-direction:column;line-height:1.25}
.saud b{font-size:13.5px;font-weight:700}
.saud span{font-size:11.5px;color:var(--muted)}
.modal-bg{position:fixed;inset:0;background:rgba(11,18,32,.5);z-index:100;display:grid;place-items:center;padding:20px;
  backdrop-filter:blur(2px)}
.modal{background:#fff;border-radius:16px;width:100%;max-width:560px;max-height:88vh;overflow:auto;box-shadow:0 24px 60px -16px rgba(11,18,32,.4)}
.modal .mh{padding:18px 20px;border-bottom:1px solid var(--line2);display:flex;align-items:center}
.modal .mh h3{margin:0;font-size:15px;font-weight:700}
.modal .mb{padding:20px}
.modal .mf{padding:14px 20px;border-top:1px solid var(--line2);display:flex;gap:9px;justify-content:flex-end}
.x{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--muted);font-size:17px;margin-left:auto}
.x:hover{background:var(--canvas)}

.toasts{position:fixed;top:16px;right:16px;z-index:200;display:flex;flex-direction:column;gap:9px}
.toast{background:var(--ink);color:#fff;padding:12px 16px;border-radius:12px;font-size:13px;font-weight:500;
  box-shadow:0 12px 30px -10px rgba(11,18,32,.5);max-width:340px;animation:sl .25s ease}
@keyframes sl{from{opacity:0;transform:translateX(18px)}}
.toast.ok{background:#065F46}.toast.err{background:#991B1B}

.notif{position:fixed;top:70px;right:26px;width:370px;background:#fff;border:1px solid var(--line);
  border-radius:14px;box-shadow:0 20px 44px -14px rgba(16,24,40,.32);z-index:60;overflow:hidden}
.notif .nh{padding:13px 16px;border-bottom:1px solid var(--line2);display:flex;align-items:center;gap:8px}
.notif .nh h4{margin:0;font-size:13px;font-weight:700}
.notif .lst{max-height:360px;overflow:auto}
.notif .it{padding:12px 16px;border-bottom:1px solid var(--line2);cursor:pointer}
.notif .it:hover{background:#FAFBFF}
.notif .it.un{background:#F5F7FF}
.notif .it .t1{font-size:12.8px;font-weight:600}
.notif .it .t2{font-size:12px;color:var(--muted);margin-top:2px}
.notif .it .t3{font-size:11px;color:var(--muted2);margin-top:4px}

.legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:12px}
.legend span{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);font-weight:500}
.hist{border-left:2px solid var(--line);padding-left:16px;margin-left:5px}
.hist .h{position:relative;padding-bottom:16px}
.hist .h:last-child{padding-bottom:0}
.hist .h:before{content:'';position:absolute;left:-21px;top:5px;width:9px;height:9px;border-radius:50%;
  background:#fff;border:2px solid var(--indigo)}
.hist .h .a{font-size:12.8px;font-weight:600}
.hist .h .b{font-size:12px;color:var(--muted);margin-top:2px}
.hist .h .c{font-size:11px;color:var(--muted2);margin-top:3px}

.chipline{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:7px;background:#F4F6FB;border:1px solid var(--line);
  border-radius:9px;padding:5px 8px 5px 11px;font-size:12.5px;font-weight:500}
.chip button{color:var(--muted2);font-size:14px;line-height:1}
.chip button:hover{color:var(--ruim)}

@media print{
  .sidebar,.topbar,.noprint{display:none!important}
  body{background:#fff}
  .content{padding:0;max-width:none}
  .card{box-shadow:none;break-inside:avoid}
}
@media(max-width:1100px){
  .kpis{grid-template-columns:repeat(3,1fr)}
  .row-4{grid-template-columns:1fr 1fr}
}
@media(max-width:820px){
  .app{flex-direction:column}
  .sidebar{width:100%;flex:none;height:auto;position:relative}
  .nav{display:flex;overflow-x:auto;padding:10px}
  .nav .grp{display:none}
  .nav button{width:auto;white-space:nowrap;margin:0 4px 0 0}
  .sidefoot{display:none}
  .content{padding:16px 14px 50px}
  .topbar{padding:0 14px;height:auto;min-height:60px;flex-wrap:wrap;padding-bottom:10px;padding-top:10px}
  .kpis{grid-template-columns:1fr 1fr}
  .row-2,.row-3,.row-4{grid-template-columns:1fr}
  .gauge{flex-direction:column;text-align:center}
  .notif{right:10px;left:10px;width:auto}
  .esteira{flex-direction:column}
  .esteira .st{border-right:0;border-bottom:1px solid var(--line2)}
}
:focus-visible{outline:2px solid var(--indigo);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="mark" style="flex:1;min-width:0">
        <div class="sq">N</div>
        <div class="txt">

function normItem(x){
 if(typeof x==='string') return {t:x,s:'',tp:'C',e:''};
 return {t:x.t||'',s:x.s||'',tp:x.tp||'C',e:x.e||''};
}

}

function migrar(){
 const c=S.config||{};
 if(c.appNome===undefined) c.appNome='Gestão da Qualidade';
 if(c.empresa===undefined) c.empresa='';
 S.plano=S.plano||[];
 normalizarTemplates();
 (S.pessoas||[]).forEach(p=>{
  if(!p.setores) p.setores = p.setor?[p.setor]:[];
  delete p.setor;
 });
 // rev 3: perfis passam a ter login e senha; 'Qualidade' vira Administrador
 S.unidadesInfo=S.unidadesInfo||{};
 S.pessoas.forEach(p=>{
  if(p.papel==='Qualidade') p.papel='Administrador';
  if(p.ativo===undefined) p.ativo=true;
  if(!p.login) p.login=loginSugerido(p.nome);
  if(!p.senha){ p.senha= p.papel==='Administrador'?'admin123':'123456'; p.senhaTemp = p.papel!=='Administrador' }
  if(p.email===undefined) p.email='';
  if(p.telefone===undefined) p.telefone='';
  if(p.cargo===undefined) p.cargo='';
 });
 if(!S.pessoas.some(p=>p.papel==='Administrador'))

 // o login 'admin' precisa existir sempre: bases criadas antes dos logins ficavam sem ele
 if(!S.pessoas.some(p=>p.login==='admin')){
  const a=S.pessoas.find(p=>p.papel==='Administrador');

 }
 (S.auditorias||[]).forEach(a=>a.itens.forEach(it=>{ if(!it.tipo) it.tipo='C' }));
 // rev 2: 5S passou a usar Conforme / Não conforme e a grafia correta do senso Seiso
 if((c.rev||1)<2){
  if(S.templates&&S.templates['5S']) S.templates['5S']=JSON.parse(JSON.stringify(TEMPLATES['5S']));
  const corrigeSecao=x=>{ if(x&&x.indexOf('Seison')===0) return x.replace('Seison','Seiso'); return x };
  Object.keys(S.templates||{}).forEach(k=>S.templates[k].forEach(x=>{ x.s=corrigeSecao(x.s) }));
  (S.auditorias||[]).forEach(a=>a.itens.forEach(it=>{

   if(it.tipo==='SN'){ it.tipo='C'; delete it.sn; delete it.esperado }

 }
}

const $=s=>document.querySelector(s);

let AC=null, ULTIMO_ALERTA=-1;
function bipe(){
 if(S&&S.config&&S.config.som===false) return;
 try{
  const C=window.AudioContext||window.webkitAudioContext; if(!C) return;
  AC=AC||new C();
  if(AC.state==='suspended') AC.resume();
  [740,988].forEach((hz,i)=>{
   const o=AC.createOscillator(), g=AC.createGain();
   o.type='sine'; o.frequency.value=hz;
   o.connect(g); g.connect(AC.destination);
   const t0=AC.currentTime+i*0.19;
   g.gain.setValueAtTime(0.0001,t0);
   g.gain.exponentialRampToValueAtTime(0.22,t0+0.02);
   g.gain.exponentialRampToValueAtTime(0.0001,t0+0.17);
   o.start(t0); o.stop(t0+0.2);
  });
 }catch(e){}
}
/* toca uma vez quando surgem avisos novos para quem está logado */
function checarAlertas(){

function toast(msg,tipo){

}
function faixaDe(pct){
 const f=S.config.faixas.find(f=>pct>=f.min&&pct<=f.max);
 if(f) return f;
 // se as faixas ficarem com intervalo aberto, usa a maior faixa cujo mínimo foi atingido
 const ord=S.config.faixas.slice().sort((a,b)=>b.min-a.min);
 return ord.find(x=>pct>=x.min)||ord[ord.length-1];
}
function prazoStatus(nc){

 if(d<=S.config.alertaDias) return {k:'prox',cor:'var(--reg)',txt:d===0?'Vence hoje':`Vence em ${d} ${d===1?'dia':'dias'}`};

}

 const l=[], hj=new Date();
 for(let m=qtd-1;m>=0;m--){ const d=new Date(hj.getFullYear(),hj.getMonth()-m,1);
  l.push(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`) }

/* imagem comprimida p/ caber no localStorage */
function lerImagem(file,cb){
 if(!file) return cb(null);
 if(!file.type.startsWith('image/')){ toast('Anexe uma imagem (JPG ou PNG).','err'); return cb(null) }
 const fr=new FileReader();
 fr.onload=()=>{
  const img=new Image();
  img.onload=()=>{
   const max=900, r=Math.min(1,max/Math.max(img.width,img.height));
   const c=document.createElement('canvas'); c.width=img.width*r; c.height=img.height*r;
   c.getContext('2d').drawImage(img,0,0,c.width,c.height);
   cb(c.toDataURL('image/jpeg',.62));
  };
  img.onerror=()=>cb(null);
  img.src=fr.result;
 };
 fr.readAsDataURL(file);
}

function calcular(a){
 let c=0,nc=0,om=0,na=0;
 a.itens.forEach(i=>{ if(i.resposta==='C')c++; else if(i.resposta==='NC')nc++; else if(i.resposta==='OM')om++; else if(i.resposta==='NA')na++; });
 const aplicaveis=c+nc+om;
 const peso=(S.config.pesoOM||0)/100;
 const pct=aplicaveis?((c+om*peso)/aplicaveis)*100:0;
 return {pct:Math.round(pct*100)/100,c,nc,om,na,aplicaveis,total:a.itens.length};
}

function seed(){
 const rnd=(a)=>a[Math.floor(Math.random()*a.length)];
 const setores=['Produção','Obra','Logística','Compras','Estoque','Almoxarifado','Administrativo'];
 const auditores=['João Batista','Patrícia Nunes','Gyselle A.'];
 const tipos=['5S','Auditoria de Processo','Auditoria Interna ISO 9001','Auditoria de procedimento/IT'];
 const achados=[
  'Falta de identificação do material em estoque',
  'IT não disponível no posto de trabalho',
  'Divergência entre a prática e o procedimento descrito',
  'Registro de inspeção sem preenchimento completo',
  'Instrumento de medição com calibração vencida',
  'Material não conforme sem segregação',
  'Área de circulação obstruída por material',
  'Treinamento sem registro no controle de competências',
  'Documento em revisão obsoleta em uso',
  'EPI em condição inadequada de uso',
  'Indicador do setor desatualizado no quadro de gestão',
  'Produto armazenado fora do local definido'
];
 const hj=new Date();
 for(let m=5;m>=0;m--){
  const ref=new Date(hj.getFullYear(),hj.getMonth()-m,1);
  const qtd= m===0?18:22+Math.floor(Math.random()*8);
  for(let k=0;k<qtd;k++){
   const dia=1+Math.floor(Math.random()*(m===0?Math.min(hj.getDate(),28):26));
   const data=`${ref.getFullYear()}-${String(ref.getMonth()+1).padStart(2,'0')}-${String(dia).padStart(2,'0')}`;
   const tipo=rnd(tipos), setor=rnd(setores), unid=rnd(S.config.unidades), aud=rnd(auditores);
   const a={id:uid(),codigo:proxCodA(),unidade:unid,setor,tipo,processo:setor,auditor:aud,data,
     status:'Concluída',criadoEm:Date.now(),itens:[]};
   const base=S.templates[tipo]||[];
   const alvo=.80+Math.random()*.20;
   base.forEach(x0=>{
    let r='C'; const x=Math.random();
    if(x>alvo) r = Math.random()<.65?'NC':'OM';
    else if(x>alvo-.04) r='NA';
    const it={id:uid(),texto:x0.t,secao:x0.s||'',tipo:x0.tp||'C',esperado:x0.e||'',resposta:r,ncId:null};
    if(it.tipo==='SN'&&(r==='C'||r==='NC')){
     const esp=it.esperado||'Sim';

function gauge(pct,size){

  <path d="M ${cx-r} ${cy} A ${r} ${r} 0 0 1 ${cx+r} ${cy}" fill="none" stroke="${f.cor}" stroke-width="13"
    stroke-linecap="round" stroke-dasharray="${circ}" stroke-dashoffset="${off}"/>
 </svg>`;
}

function barrasH(dados,corFn){
 if(!dados.length) return `<div class="empty"><p>Sem dados no período</p></div>`;
 const max=Math.max(...dados.map(d=>d.v),1);
 return `<div style="display:flex;flex-direction:column;gap:11px">`+dados.map(d=>{
  const cor=corFn?corFn(d):'var(--indigo)';
  return `<div>
   <div style="display:flex;justify-content:space-between;font-size:12.3px;font-weight:600;margin-bottom:5px">
     <span style="color:#3B4557">${esc(d.k)}</span>
     <span class="num" style="color:${cor}">${d.sufixo!==undefined?d.sufixo:n1(d.v)+'%'}</span></div>
   <div class="prog"><i style="width:${(d.v/max)*100}%;background:${cor}"></i></div>
  </div>`}).join('')+`</div>`;
}

function linha(dados){
 if(dados.length<2) return `<div class="empty"><p>Dados insuficientes</p></div>`;
 const W=560,H=190,pl=34,pr=12,pt=16,pb=28;
 const iw=W-pl-pr, ih=H-pt-pb;
 const min=Math.max(0,Math.min(...dados.map(d=>d.v))-8), max=Math.min(100,Math.max(...dados.map(d=>d.v))+5);
 const X=i=>pl+(iw*(i/(dados.length-1)));
 const Y=v=>pt+ih-((v-min)/((max-min)||1))*ih;
 const pts=dados.map((d,i)=>`${X(i)},${Y(d.v)}`).join(' ');
 const area=`${pl},${pt+ih} ${pts} ${X(dados.length-1)},${pt+ih}`;
 let grid='';
 [0,.25,.5,.75,1].forEach(f=>{
  const y=pt+ih*f, val=max-(max-min)*f;
  grid+=`<line x1="${pl}" y1="${y}" x2="${W-pr}" y2="${y}" stroke="#EEF1F7"/>
   <text x="${pl-7}" y="${y+4}" text-anchor="end" font-size="10" fill="#9AA3B2" font-family="Archivo Narrow">${Math.round(val)}</text>`;
 });
 return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" role="img" aria-label="Evolução mensal do resultado">
  ${grid}
  <polygon points="${area}" fill="rgba(79,70,229,.10)"/>
  <polyline points="${pts}" fill="none" stroke="var(--indigo)" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
  ${dados.map((d,i)=>`<circle cx="${X(i)}" cy="${Y(d.v)}" r="4" fill="#fff" stroke="var(--indigo)" stroke-width="2.4"/>
   <text x="${X(i)}" y="${H-9}" text-anchor="middle" font-size="10.5" fill="#6B7280" font-family="Archivo Narrow">${esc(d.k)}</text>
   <text x="${X(i)}" y="${Y(d.v)-11}" text-anchor="middle" font-size="10.5" font-weight="700" fill="#374151">${n1(d.v)}</text>`).join('')}
 </svg>`;
}

function donut(dados){
 const tot=dados.reduce((s,d)=>s+d.v,0);
 if(!tot) return `<div class="empty"><p>Sem não conformidades</p></div>`;
 const R=52,r=33,cx=70,cy=70; let ang=-90, seg='';
 dados.forEach(d=>{
  if(!d.v) return;
  const a=(d.v/tot)*360, a2=ang+a;
  const rad=x=>x*Math.PI/180;
  const x1=cx+R*Math.cos(rad(ang)), y1=cy+R*Math.sin(rad(ang));
  const x2=cx+R*Math.cos(rad(a2)), y2=cy+R*Math.sin(rad(a2));
  const x3=cx+r*Math.cos(rad(a2)), y3=cy+r*Math.sin(rad(a2));
  const x4=cx+r*Math.cos(rad(ang)), y4=cy+r*Math.sin(rad(ang));
  const lg=a>180?1:0;
  seg+=`<path d="M${x1} ${y1} A${R} ${R} 0 ${lg} 1 ${x2} ${y2} L${x3} ${y3} A${r} ${r} 0 ${lg} 0 ${x4} ${y4} Z" fill="${d.cor}"/>`;
  ang=a2;
 });
 return `<div style="display:flex;align-items:center;gap:20px;flex-wrap:wrap">
  <svg width="140" height="140" viewBox="0 0 140 140" role="img" aria-label="Não conformidades por classificação">
   ${seg}<text x="70" y="66" text-anchor="middle" font-size="24" font-weight="800" fill="#111827">${tot}</text>
   <text x="70" y="82" text-anchor="middle" font-size="10" fill="#9AA3B2" font-family="Archivo Narrow" letter-spacing="1">NC ABERTAS</text>
  </svg>
  <div style="display:flex;flex-direction:column;gap:9px">
   ${dados.map(d=>`<div style="display:flex;align-items:center;gap:9px;font-size:12.6px">
     <span class="dot" style="background:${d.cor}"></span><span style="font-weight:600;min-width:56px">${esc(d.k)}</span>
     <span class="num" style="color:var(--muted)">${d.v} · ${tot?Math.round(d.v/tot*100):0}%</span></div>`).join('')}
  </div></div>`;
}

function escopo(){
 DASH.ym=DASH.ym||mesRef();
 DASH.ano=DASH.ano||hoje().slice(0,4);
 const perfil=perfilAtual();
 const meusSetores = perfilReal()==='Gestor' ? setoresDe(usuario()) : null;
 let auds=audsVisiveis().filter(a=>a.status==='Concluída');

 const noPeriodo = d => DASH.modo==='ano' ? d.slice(0,4)===DASH.ano : d.slice(0,7)===DASH.ym;
 auds=auds.filter(a=>noPeriodo(a.data));
 if(DASH.unidade){ auds=auds.filter(a=>a.unidade===DASH.unidade); ncs=ncs.filter(n=>n.unidade===DASH.unidade) }
 if(DASH.setor){ auds=auds.filter(a=>a.setor===DASH.setor); ncs=ncs.filter(n=>n.setor===DASH.setor) }
 const meses = DASH.modo==='ano'
   ? Array.from({length:12},(_,i)=>`${DASH.ano}-${String(i+1).padStart(2,'0')}`)
   : mesesRecentes(6);
 let planejadas = DASH.modo==='ano'
   ? meses.reduce((t,m)=>t+planejadasDoMes(m),0)

function criarAuditoria5S(){

/* ---------------- CHECKLIST ---------------- */
function vChecklist(){
 const a=S.auditorias.find(x=>x.id===VIEW.p.id);
 if(!a) return go('auditorias');
 head(`${a.codigo} — checklist`,`${a.unidade} · ${a.setor} · ${a.tipo}`);
 const resp=a.itens.filter(i=>i.resposta).length;
 const parcial=calcular(a);
 const f=faixaDe(parcial.pct);

 $('#view').innerHTML=`
 <div class="card" style="margin-bottom:16px"><div class="bd" style="display:flex;gap:26px;flex-wrap:wrap;align-items:center">
  ${[['Unidade',a.unidade],['Setor',a.setor],['Processo',a.processo],['Tipo',a.tipo],['Auditor',a.auditor],['Data',fmt(a.data)]]
   .map(([k,v])=>`<div><div class="eyebrow">${k}</div><div style="font-weight:600;font-size:13.4px;margin-top:2px">${esc(v)}</div></div>`).join('')}
  <div class="spacer"></div>
  ${podeEditarChecklist()?`
   <button class="btn btn-s btn-sm" onclick="modalItem('${a.id}')">＋ Adicionar item</button>
   <button class="btn btn-s btn-sm" onclick="marcarRestantes('${a.id}')" ${resp===a.itens.length?'disabled':''}>Marcar restantes como conforme</button>`
  :`<span style="font-size:12px;color:var(--muted)">Checklist padronizado — responda todos os itens</span>`}
 </div>
 <div class="bd" style="border-top:1px solid var(--line2);display:flex;gap:26px;flex-wrap:wrap;padding:13px 18px">
  ${[['Conformes',parcial.c,'var(--ok)'],['Não conformes',parcial.nc,'var(--ruim)'],
     ['Oportunidades',parcial.om,'var(--reg)'],['Não aplicáveis',parcial.na,'#64748B'],
     ['Sem resposta',a.itens.length-resp,'#9AA3B2']]
   .map(([k,v,c])=>`<div><div class="eyebrow">${k}</div>
    <div class="num" style="font-size:19px;font-weight:800;color:${c}">${v}</div></div>`).join('')}
 </div></div>

 <div id="itens">${renderItens(a)||
  `<div class="card"><div class="empty"><div class="big">☑</div><p>Nenhum item no checklist</p><span>Use “Adicionar item” para montar a lista desta auditoria.</span></div></div>`}</div>

 <div class="stickybar">
  <div style="flex:1;min-width:180px">
   <div style="display:flex;justify-content:space-between;font-size:12px;font-weight:600;margin-bottom:5px">
    <span>${resp} de ${a.itens.length} itens respondidos</span>
    <span class="num" style="color:${f.cor}">parcial ${n1(parcial.pct)}%</span></div>
   <div class="prog"><i style="width:${a.itens.length?resp/a.itens.length*100:0}%"></i></div>
  </div>
  <button class="btn btn-s" onclick="go('auditorias')">Salvar e sair</button>
  <button class="btn btn-p" onclick="finalizar('${a.id}')" ${resp<a.itens.length||!a.itens.length?'disabled':''}>Finalizar auditoria</button>
 </div>`;
}

function renderItens(a){
 let h='', sec=null;
 a.itens.forEach((it,i)=>{
  const s0=it.secao||'';
  if(s0!==sec){
   sec=s0;
   if(s0){
    const qtd=a.itens.filter(x=>(x.secao||'')===s0).length;
    const ok=a.itens.filter(x=>(x.secao||'')===s0&&x.resposta).length;
    h+=`<div class="secao">${esc(s0)}<span class="bar"></span>
      <span class="qt">${ok}/${qtd} RESPONDIDOS</span></div>`;
   }
  }
  h+=itemHTML(a,it,i);
 });
 return h;
}
function itemHTML(a,it,i){
 const nc=it.ncId?S.ncs.find(n=>n.id===it.ncId):null;
 const tipo=it.tipo||'C';
 let botoes='';
 if(tipo==='SN'){
  const esp=it.esperado||'Sim';
  botoes=['Sim','Não'].map(v=>{
   const conforme = v===esp;
   return `<button class="opt ${it.sn===v?'on':''}" data-v="${conforme?'C':'NC'}"
     onclick="responder('${a.id}','${it.id}','${v==='Sim'?'SIM':'NAO'}')">${v}</button>`}).join('')
   + `<button class="opt ${it.resposta==='OM'?'on':''}" data-v="OM"
      onclick="responder('${a.id}','${it.id}','OM')">Oportunidade de melhoria</button>`
   + `<button class="opt ${it.resposta==='NA'?'on':''}" data-v="NA"
      onclick="responder('${a.id}','${it.id}','NA')">Não aplicável</button>`;
 } else {
  botoes=Object.keys(RESP).map(k=>`<button class="opt ${it.resposta===k?'on':''}" data-v="${k}"
     onclick="responder('${a.id}','${it.id}','${k}')">${RESP[k]}</button>`).join('');
 }
 return `<div class="itemrow ${it.resposta?'answered':''}" id="it_${it.id}">
  <div class="top">
   <div class="idx num">${String(i+1).padStart(2,'0')}</div>
   <div class="txt">${esc(it.texto)}
    ${tipo==='SN'?`<div style="margin-top:6px"><span class="esp">Resposta esperada: ${esc(it.esperado||'Sim')}</span></div>`:''}
   </div>
   ${podeEditarChecklist()?`<button class="x" onclick="removerItem('${a.id}','${it.id}')" title="Remover item">×</button>`:''}
  </div>
  ${tipo==='A'?`<div style="padding:0 16px 12px 53px">
    <textarea placeholder="Registre a pergunta feita e a resposta do colaborador"
      onchange="campoAberto('${it.id}',this.value)">${esc(it.aberta||'')}</textarea>
    <div class="hint" style="font-size:11.5px;color:var(--muted);margin-top:5px">
     Depois de registrar a resposta, avalie o item abaixo.</div></div>`:''}
  <div class="opts">${botoes}</div>
  ${it.resposta==='NC'?ncFormHTML(a,it,nc):''}
  ${it.resposta==='OM'?omFormHTML(a,it):''}
 </div>`;
}
function campoAberto(iid,val){ if(modoConsulta()) return; const {it}=itemDe(iid); if(it){ it.aberta=val; save() } }

function omFormHTML(a,it){
 return `<div class="ombox">
  <div class="hd2">◇ Oportunidade de melhoria</div>
  <div class="field" style="margin-bottom:0"><label>Descrição da oportunidade</label>
   <textarea placeholder="O que pode ser melhorado e qual é o ganho esperado."
     onchange="campoOM('${it.id}',this.value)">${esc(it.om||'')}</textarea></div>
 </div>`;
}

function podeEditarChecklist(){ return perfilAtual()==='Administrador' }
function itemDe(id){
 for(const a of S.auditorias){ const it=a.itens.find(x=>x.id===id); if(it) return {a,it} }
 return {};
}
function responder(aid,iid,v){
 if(bloqueado()) return;
 const a=S.auditorias.find(x=>x.id===aid), it=a.itens.find(x=>x.id===iid);
 const antes=it.resposta;
 if(v==='SIM'||v==='NAO'){
  // item de sim/não: a conformidade sai da comparação com a resposta esperada
  const dado = v==='SIM'?'Sim':'Não';
  const esp = it.esperado||'Sim';
  if(it.sn===dado){ it.sn=null; it.resposta=null }
  else { it.sn=dado; it.resposta = dado===esp ? 'C' : 'NC' }
 } else {
  it.sn=null;
  it.resposta = antes===v ? null : v;
 }
 if(it.resposta!=='NC'&&it.ncId){
  S.ncs=S.ncs.filter(n=>n.id!==it.ncId); it.ncId=null;
 }
 if(it.resposta==='NC'&&!it.ncId){
  const pz=new Date(); pz.setDate(pz.getDate()+20);
  const nc={id:uid(),codigo:proxCodN(),auditoriaId:a.id,itemId:it.id,item:it.texto,unidade:a.unidade,setor:a.setor,
   auditor:a.auditor,descricao:'',observacao:'',evidencia:null,classificacao:'Menor',
   responsavel:gestorDoSetor(a.setor),prazo:pz.toISOString().slice(0,10),status:'Pendente',plano:null,
   abertaEm:Date.now(),rascunho:true,historico:[]};
  S.ncs.push(nc); it.ncId=nc.id;
 }
 if(it.resposta!=='OM') delete it.om;
 save();
 // conforme ou não aplicável: segue direto para o próximo item sem resposta
 if(it.resposta==='C'||it.resposta==='NA'){
  const idx=a.itens.findIndex(x=>x.id===iid);
  const prox=a.itens.slice(idx+1).find(x=>!x.resposta);
  window._proxItem=prox?prox.id:null;
 } else window._proxItem=null;
 vChecklist();
 if(window._proxItem){
  const el=document.getElementById('it_'+window._proxItem);
  if(el) el.scrollIntoView({block:'center',behavior:'smooth'});
  window._proxItem=null;
 }
}
function marcarRestantes(aid){
 if(bloqueado()) return;
 const a=S.auditorias.find(x=>x.id===aid);
 const faltam=a.itens.filter(i=>!i.resposta).length;
 if(!faltam) return;
 confirmar('Marcar restantes como conforme?',`${faltam} item(ns) sem resposta serão marcados como Conforme. Revise antes de finalizar.`,()=>{
  a.itens.forEach(i=>{ if(!i.resposta){ i.resposta='C'; if((i.tipo||'C')==='SN') i.sn=i.esperado||'Sim' } });
  save(); vChecklist();
 },'Marcar '+faltam);
}
function campoNC(iid,campo,val){
 if(modoConsulta()) return;
 const {it}=itemDe(iid); if(!it||!it.ncId) return;
 const nc=S.ncs.find(n=>n.id===it.ncId);
 if(campo==='responsavel') val=val.split(' — ')[0];
 nc[campo]=val; save();
 if(campo==='evidencia') vChecklist();
}
function campoOM(iid,val){ if(modoConsulta()) return; const {it}=itemDe(iid); if(it){ it.om=val; save() } }
function anexarNC(iid,file){
 lerImagem(file,d=>{ if(d){ campoNC(iid,'evidencia',d); toast('Evidência anexada.','ok') } });
}
function removerItem(aid,iid){
 if(bloqueado()) return;
 const a=S.auditorias.find(x=>x.id===aid), it=a.itens.find(x=>x.id===iid);
 if(it.ncId) S.ncs=S.ncs.filter(n=>n.id!==it.ncId);
 a.itens=a.itens.filter(x=>x.id!==iid); save(); vChecklist();
}
function modalItem(aid){
 const a=S.auditorias.find(x=>x.id===aid);
 const secoes=[...new Set(a.itens.map(y=>y.secao).filter(Boolean))];
 modal('Adicionar item ao checklist',
  `<div class="field"><label>Pergunta ou requisito</label>
   <textarea id="novoItem" placeholder="Ex.: Os registros de inspeção estão preenchidos e assinados"></textarea></div>
   <div class="field"><label>Seção</label>
    <input type="text" id="novoSecao" list="niSec" placeholder="Opcional">
    <datalist id="niSec">${secoes.map(y=>`<option value="${esc(y)}">`).join('')}</datalist></div>
   <div class="row row-2">
    <div class="field" style="margin-bottom:0"><label>Tipo de resposta</label>
     <select id="novoTipo" onchange="document.getElementById('niEsp').style.display=this.value==='SN'?'block':'none'">
      <option value="C">Conforme / Não conforme</option>
      <option value="SN">Pergunta de Sim ou Não</option>
      <option value="A">Resposta aberta</option></select></div>
    <div class="field" id="niEsp" style="display:none;margin-bottom:0"><label>Resposta esperada</label>
     <select id="novoEsp"><option>Sim</option><option>Não</option></select></div>
   </div>`,
  `<button class="btn btn-s" onclick="fecharModal()">Cancelar</button>
   <button class="btn btn-p" onclick="salvarItem('${aid}')">Adicionar</button>`);
 setTimeout(()=>$('#novoItem').focus(),60);
}
function salvarItem(aid){
 if(bloqueado()) return;
 const t=$('#novoItem').value.trim(); if(!t){ toast('Escreva o texto do item.','err'); return }
 const a=S.auditorias.find(x=>x.id===aid);
 const tp=$('#novoTipo').value;
 a.itens.push({id:uid(),texto:t,secao:$('#novoSecao').value.trim(),tipo:tp,
   esperado:tp==='SN'?$('#novoEsp').value:'',resposta:null,ncId:null});
 save(); fecharModal(); vChecklist();
}

function finalizar(aid){
 if(bloqueado()) return;
 const a=S.auditorias.find(x=>x.id===aid);
 const pend=a.itens.filter(i=>!i.resposta).length;
 if(pend){ toast(`Ainda há ${pend} item(ns) sem resposta.`,'err'); return }
 const ncs=S.ncs.filter(n=>n.auditoriaId===a.id);
 const semDesc=ncs.filter(n=>!n.descricao.trim());
 if(semDesc.length){ toast('Descreva todas as não conformidades antes de finalizar.','err'); return }
 const semPrazo=ncs.filter(n=>!n.prazo);
 if(semPrazo.length){ toast('Informe o prazo de todas as não conformidades.','err'); return }

 a.resultado=calcular(a); a.status='Concluída'; a.finalizadaEm=Date.now();
 const f=faixaDe(a.resultado.pct);
 ncs.forEach(n=>{
  n.rascunho=false;
  if(!n.historico.length) logNCcomo(n,a.auditor,'Não conformidade registrada','');
  notificar(n.responsavel,'Nova não conformidade atribuída',
   `${n.codigo} — ${n.descricao} · prazo ${fmt(n.prazo)}`,{n:'nc',p:{id:n.id}});
 });
 const porGestor=[...new Set(ncs.map(n=>n.responsavel))];
 porGestor.forEach(g=>{
  const q=ncs.filter(n=>n.responsavel===g).length;
  notificar(g,'Nova auditoria concluída',
   `Setor: ${a.setor}\nResultado: ${n1(a.resultado.pct)}% — ${f.label}\nNão conformidades: ${q}\n\nAcesse o aplicativo para visualizar os apontamentos e realizar o plano de ação.`,
   {n:'resultado',p:{id:a.id}});
 });
 notificar('Administrador','Nova auditoria concluída',
  `${a.codigo} · ${a.unidade}\nSetor: ${a.setor}\nResultado: ${n1(a.resultado.pct)}% — ${f.label}\nNão conformidades: ${ncs.length}`,
  {n:'resultado',p:{id:a.id}});

function anexarPlano(id,file){
 const n=S.ncs.find(x=>x.id===id);
 lerImagem(file,d=>{ if(!d) return;
  n.plano=n.plano||{causa:'',acao:'',responsavel:n.responsavel,prazo:n.prazo,evidencia:null};
  n.plano.evidencia=d; save(); toast('Evidência anexada.','ok'); vNC(); });
}
function removerEvidPlano(id){ const n=S.ncs.find(x=>x.id===id); if(n.plano){n.plano.evidencia=null;save();vNC()} }

function salvarPlano(id,enviar){
 if(bloqueado()) return;
 const n=S.ncs.find(x=>x.id===id);
 const causa=$('#pCausa').value.trim(), acao=$('#pAcao').value.trim();
 const resp=$('#pResp').value, prazo=$('#pPrazo').value;
 const evid=n.plano?n.plano.evidencia:null;
 if(enviar){
  if(!causa||!acao){ toast('Preencha a causa e a ação corretiva.','err'); return }
  if(!evid){ toast('Anexe a evidência da ação executada.','err'); return }
 }
 const novo=!n.plano;
 n.plano={causa,acao,responsavel:resp,prazo,evidencia:evid};
 if(enviar){
  n.status='Em validação'; n.plano.enviadoEm=Date.now();
  logNC(n,'Evidência enviada para validação da Qualidade','');
  notificar('Administrador','Evidência aguardando validação',`${n.codigo} — ${n.setor} · ${n.descricao}`,{n:'nc',p:{id:n.id}});
  toast('Enviado para validação da Qualidade.','ok');
 } else {
  if(n.status==='Pendente') n.status='Em andamento';
  logNC(n,novo?'Plano de ação registrado':'Plano de ação atualizado','');
  toast('Plano de ação salvo.','ok');
 }
 save(); vNC();
}

function validar(id,acao){
 if(bloqueado()) return;
 const n=S.ncs.find(x=>x.id===id);
 const obs=($('#vObs')&&$('#vObs').value.trim())||'';
 if(acao!=='aprovar'&&!obs){ toast('Escreva o parecer explicando o que precisa ser corrigido.','err'); return }
 if(acao==='aprovar'){
  n.status='Encerrada'; n.encerradaEm=Date.now();
  logNC(n,'Validada e encerrada pela Qualidade',obs);
  notificar(n.responsavel,'Não conformidade encerrada',`${n.codigo} — ação validada pela Qualidade`,{n:'nc',p:{id:n.id}});
  toast(`${n.codigo} encerrada.`,'ok');
 } else if(acao==='ajuste'){
  n.status='Ajuste solicitado';
  logNC(n,'Ajuste solicitado pela Qualidade',obs);
  notificar(n.responsavel,'Ajuste solicitado',`${n.codigo} — ${obs}`,{n:'nc',p:{id:n.id}});
  toast('Devolvida ao gestor para ajuste.');
 } else {
  n.status='Reprovada';
  logNC(n,'Ação reprovada pela Qualidade',obs);
  notificar(n.responsavel,'Ação reprovada',`${n.codigo} — ${obs}`,{n:'nc',p:{id:n.id}});
  toast('Ação reprovada e devolvida ao gestor.');
 }
 save(); render();
}

function alternarSetoresUsuario(){
 const v=$('#uPapel').value;
 $('#boxSetores').style.display = v==='Administrador'?'none':'block';

function sugerirLogin(){
 const l=$('#uLogin'); if(l && !l.dataset.tocado) l.value=loginSugerido($('#uNome').value);
}
function salvarUsuario(i){
 if(bloqueado()) return;
 const nome=$('#uNome').value.trim();
 if(!nome){ toast('Informe o nome.','err'); return }
 const papel=$('#uPapel').value;
 const login=($('#uLogin').value.trim()||loginSugerido(nome)).toLowerCase().replace(/\s+/g,'.');
 const setores=[...document.querySelectorAll('.uSt:checked')].map(x=>x.value);
 if(papel==='Gestor'&&!setores.length){ toast('Selecione ao menos um setor para o gestor de área.','err'); return }
 const dup=S.pessoas.some((x,idx)=>x.login===login&&idx!==i);
 if(dup){ toast('Já existe um usuário com esse login.','err'); return }
 const unidades=[...document.querySelectorAll('.uUn:checked')].map(x=>x.value);
 const dados={nome,papel,setores,login,unidades,cargo:$('#uCargo').value.trim(),
   email:$('#uEmail').value.trim(),telefone:$('#uTel').value.trim()};
 if(i===null||i===undefined){
  S.pessoas.push(Object.assign(dados,{senha:$('#uSenha').value.trim()||senhaTemporaria(),
    senhaTemp:true,ativo:true,criadoEm:Date.now()}));
  toast('Cadastro criado. Informe o login e a senha temporária à pessoa.','ok');
 } else {
  const antigo=S.pessoas[i];
  const nomeAntigo=antigo.nome;
  S.pessoas[i]=Object.assign({},antigo,dados);
  const nv=($('#uSenha').value||'').trim();
  if(nv){ S.pessoas[i].senha=nv; S.pessoas[i].senhaTemp=true }
  if(nomeAntigo!==nome){
   S.ncs.forEach(x=>{ if(x.responsavel===nomeAntigo) x.responsavel=nome; if(x.auditor===nomeAntigo) x.auditor=nome;
     if(x.plano&&x.plano.responsavel===nomeAntigo) x.plano.responsavel=nome });
   S.auditorias.forEach(x=>{ if(x.auditor===nomeAntigo) x.auditor=nome });
   (S.plano||[]).forEach(x=>{ if(x.auditor===nomeAntigo) x.auditor=nome });
  }
  if(SESSION.login===antigo.login){ SESSION.login=login; SESSION.nome=nome; SESSION.perfil=papel+' — '+nome; salvarSessao() }
  toast('Cadastro atualizado.','ok');
 }
 save(); fecharModal(); render();
}
function resetarSenha(i){

 const p=S.pessoas[i], nova=senhaTemporaria();
 confirmar('Resetar a senha?',`Será gerada uma senha temporária para ${p.nome}. A senha atual deixa de funcionar.`,()=>{
  p.senha=nova; p.senhaTemp=true; save(); fecharModal(); vApoio();
  modal('Senha temporária gerada',
   `<p style="margin:0 0 14px;color:#4B5563">Informe estes dados a <b>${esc(p.nome)}</b>:</p>

function excluirUsuario(i){
 if(bloqueado()) return;
 const p=S.pessoas[i];
 if(p.login===SESSION.login){ toast('Você não pode excluir o próprio cadastro.','err'); return }
 if(p.papel==='Administrador'&&S.pessoas.filter(x=>x.papel==='Administrador').length<=1){
  toast('É preciso manter ao menos um gestor da qualidade.','err'); return }
 const ncs=S.ncs.filter(n=>n.responsavel===p.nome&&n.status!=='Encerrada').length;
 const auds=S.auditorias.filter(a=>a.auditor===p.nome).length;
 let aviso=`O acesso de ${p.nome} será removido definitivamente.`;
 if(auds) aviso+=` As ${auds} auditoria(s) já registradas continuam no histórico com o nome dela.`;
 if(ncs) aviso+=` Atenção: ${ncs} não conformidade(s) em aberto ficarão sem responsável — transfira antes.`;
 confirmar('Excluir o cadastro?',aviso,()=>{
  if(ncs){ toast('Transfira as não conformidades em aberto antes de excluir.','err'); fecharModal(); return }
  S.pessoas.splice(i,1); save(); fecharModal(); vApoio(); toast('Cadastro excluído.','ok');
 },'Excluir','btn-no');
}
function alternarAtivo(i){
 if(bloqueado()) return;
 const p=S.pessoas[i];
 if(p.ativo===false){ p.ativo=true; save(); vApoio(); toast('Acesso reativado.','ok'); return }
 const abertas=S.ncs.filter(n=>n.responsavel===p.nome&&n.status!=='Encerrada').length;
 confirmar('Desativar o acesso?',
  `${p.nome} não conseguirá mais entrar no sistema.`+(abertas?` Atenção: há ${abertas} não conformidade(s) em aberto sob responsabilidade dessa pessoa.`:''),()=>{
  p.ativo=false; save(); fecharModal(); vApoio(); toast('Acesso desativado.');
 },'Desativar','btn-no');
}

}
function salvarSetor(i){
 if(bloqueado()) return;
 const nome=$('#stNome').value.trim();
 if(!nome){ toast('Informe o nome do setor.','err'); return }
 const novo = i===null||i===undefined;
 if(novo&&S.config.setores.includes(nome)){ toast('Já existe um setor com esse nome.','err'); return }
 let antigo=null;
 if(novo) S.config.setores.push(nome);
 else{
  antigo=S.config.setores[i];
  if(nome!==antigo&&S.config.setores.includes(nome)){ toast('Já existe um setor com esse nome.','err'); return }
  S.config.setores[i]=nome;
  if(antigo!==nome){
   S.auditorias.forEach(a=>{ if(a.setor===antigo) a.setor=nome });
   S.ncs.forEach(n=>{ if(n.setor===antigo) n.setor=nome });
   (S.plano||[]).forEach(x=>{ if(x.setor===antigo) x.setor=nome });
   S.pessoas.forEach(pp=>{ pp.setores=setoresDe(pp).map(x=>x===antigo?nome:x) });
  }
 }
 save(); fecharModal(); vApoio(); toast('Setor salvo.','ok');
}
function excluirSetor(i){
 if(bloqueado()) return;
 const st=S.config.setores[i];
 const q=S.auditorias.filter(a=>a.setor===st).length;
 if(q){ toast(`Não dá para excluir: há ${q} auditoria(s) registrada(s) nesse setor.`,'err'); return }
 if(S.config.setores.length<=1){ toast('Mantenha pelo menos um setor cadastrado.','err'); return }
 confirmar('Excluir o setor?',`“${st}” será removido e desvinculado de todos os gestores e auditores.`,()=>{
  S.config.setores.splice(i,1);
  S.pessoas.forEach(p=>{ p.setores=setoresDe(p).filter(x=>x!==st) });
  (S.plano||[]).forEach(x=>{ if(x.setor===st) x.setor=S.config.setores[0] });
  save(); fecharModal(); vApoio(); toast('Setor excluído.','ok');
 },'Excluir','btn-no');
}

 if(q){ toast(`Não dá para excluir: há ${q} auditoria(s) registrada(s) nessa unidade.`,'err'); return }

 confirmar('Excluir a unidade?',`“${u}” será removida e desvinculada das pessoas cadastradas.`,()=>{

function listaConfig(titulo,chave){
 return `<div class="card"><div class="hd"><h3>${titulo}</h3>
   <span class="note">${S.config[chave].length} cadastrado(s)</span></div><div class="bd">
  <div class="chipline" style="margin-bottom:12px">
   ${S.config[chave].map((v,i)=>`<span class="chip">${esc(v)}
     <button onclick="renomearCfg('${chave}',${i})" title="Renomear" style="font-size:12px">✎</button>
     <button onclick="delCfg('${chave}',${i})" title="Remover">×</button></span>`).join('')}
  </div>
  <div style="display:flex;gap:8px">
   <input type="text" id="add_${chave}" placeholder="Adicionar…" onkeydown="if(event.key==='Enter')addCfg('${chave}')">
   <button class="btn btn-s btn-sm" onclick="addCfg('${chave}')">Adicionar</button>
  </div></div></div>`;
}
function addCfg(k){
 const el=$('#add_'+k), v=el.value.trim(); if(!v) return;
 if(S.config[k].includes(v)){ toast('Esse item já existe.','err'); return }
 S.config[k].push(v);
 if(k==='tipos'&&!S.templates[v]) S.templates[v]=[];
 save(); vConfig();
}
function delCfg(k,i){
 if(S.config[k].length<=1){ toast('Mantenha pelo menos um item cadastrado na lista.','err'); return }
 S.config[k].splice(i,1); save(); vConfig();
}
function cfg(k,v){ S.config[k]=v; save(); toast('Configuração atualizada.','ok'); render() }
function renomearCfg(k,i){
 const antigo=S.config[k][i];
 modal('Renomear',`<div class="field" style="margin-bottom:0"><label>Novo nome</label>
   <input type="text" id="rnNovo" value="${esc(antigo)}"></div>
   <div class="hint" style="margin-top:8px;font-size:12px;color:var(--muted)">
    Os registros já existentes que usam “${esc(antigo)}” serão atualizados junto.</div>`,
  `<button class="btn btn-s" onclick="fecharModal()">Cancelar</button>
   <button class="btn btn-p" onclick="salvarRenomear('${k}',${i})">Salvar</button>`);
 setTimeout(()=>$('#rnNovo').focus(),60);
}
function salvarRenomear(k,i){
 const antigo=S.config[k][i], novo=$('#rnNovo').value.trim();
 if(!novo){ toast('Informe o novo nome.','err'); return }
 if(novo!==antigo&&S.config[k].includes(novo)){ toast('Já existe um item com esse nome.','err'); return }
 S.config[k][i]=novo;
 const campo = k==='unidades'?'unidade':k==='setores'?'setor':'tipo';
 S.auditorias.forEach(a=>{ if(a[campo]===antigo) a[campo]=novo });
 (S.plano||[]).forEach(x=>{ if(x[campo]===antigo) x[campo]=novo });
 S.ncs.forEach(n=>{ if(k!=='tipos'&&n[campo]===antigo) n[campo]=novo });
 if(k==='setores') S.pessoas.forEach(pp=>{ pp.setores=setoresDe(pp).map(x=>x===antigo?novo:x) });
 if(k==='tipos'&&S.templates[antigo]){ S.templates[novo]=S.templates[antigo]; delete S.templates[antigo] }
 save(); fecharModal(); vConfig(); toast('Renomeado.','ok');
}
function faixa(i,k,v){ S.config.faixas[i][k]= k==='label'?v:parseFloat(v); save(); vConfig() }

   </div>
   <div class="field" style="margin-bottom:0"><label>Setores sob responsabilidade</label>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;background:var(--canvas);
      border:1px solid var(--line);border-radius:10px;padding:12px 14px;max-height:220px;overflow:auto">
     ${S.config.setores.map(st=>`<label style="display:flex;align-items:center;gap:8px;font-size:13px;font-weight:500;cursor:pointer">
       <input type="checkbox" class="pnSt" value="${esc(st)}" ${setoresDe(p).includes(st)?'checked':''}
         style="width:auto;margin:0"> ${esc(st)}</label>`).join('')}
    </div>
    <div class="hint">Um gestor pode responder por vários setores — as não conformidades de todos eles caem na mesma fila.</div></div>`,

   <button class="btn btn-p" onclick="salvarPessoa(${edit?i:'null'})">${edit?'Salvar':'Adicionar'}</button>`);
 setTimeout(()=>$('#pnNome').focus(),60);
}
function salvarPessoa(i){
 const n=$('#pnNome').value.trim();
 if(!n){ toast('Informe o nome.','err'); return }
 const setores=[...document.querySelectorAll('.pnSt:checked')].map(x=>x.value);
 const papel=$('#pnPapel').value;
 if(papel==='Gestor'&&!setores.length){ toast('Selecione ao menos um setor para o gestor.','err'); return }
 if(i===null||i===undefined){
  if(S.pessoas.some(x=>x.nome===n)){ toast('Já existe alguém com esse nome.','err'); return }
  S.pessoas.push({nome:n,papel,setores});
 } else {
  const antigo=S.pessoas[i].nome;
  S.pessoas[i]={nome:n,papel,setores};
  if(antigo!==n){
   S.ncs.forEach(x=>{ if(x.responsavel===antigo) x.responsavel=n; if(x.auditor===antigo) x.auditor=n;

/* ---------------- backup ---------------- */
function baixar(nome,conteudo,tipo){
 const b=new Blob([conteudo],{type:tipo}); const u=URL.createObjectURL(b);
 const a=document.createElement('a'); a.href=u; a.download=nome; a.click(); URL.revokeObjectURL(u);
}
function exportar(){ baixar(`backup-auditorias-${hoje()}.json`,JSON.stringify(S),'application/json'); toast('Backup gerado.','ok') }
function importar(f){
 if(!f) return; const fr=new FileReader();
 fr.onload=()=>{ try{ const d=JSON.parse(fr.result); if(!d.auditorias) throw 0;
   S=d; save(); toast('Backup importado.','ok'); go('dashboard') }catch(e){ toast('Arquivo inválido.','err') } };
 fr.readAsText(f);
}
function exportarCSV(){
 const h=['Código','Auditoria','Unidade','Setor','Descrição','Classificação','Responsável','Prazo','Status','Causa','Ação corretiva'];
 const linhas=S.ncs.filter(n=>!n.rascunho).map(n=>{
  const a=S.auditorias.find(x=>x.id===n.auditoriaId);
  return [n.codigo,a?a.codigo:'',n.unidade,n.setor,n.descricao,n.classificacao,n.responsavel,fmt(n.prazo),n.status,
   (n.plano&&n.plano.causa)||'',(n.plano&&n.plano.acao)||''];
 });
 const csv='\uFEFF'+[h,...linhas].map(l=>l.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(';')).join('\n');
 baixar(`nao-conformidades-${hoje()}.csv`,csv,'text/csv'); toast('CSV gerado.','ok');
}
function zerar(){
 confirmar('Apagar todos os dados?','As auditorias, as não conformidades e as configurações serão removidas deste navegador. Exporte o backup antes, se quiser guardar o histórico.',()=>{

     <b style="font-size:14px">${n.codigo}</b>
     <span class="tag" style="background:${corNC(n.classificacao)}1A;color:${corNC(n.classificacao)}">${n.classificacao}</span>
     <span class="tag" style="background:${corStatusNC(n.status)}1A;color:${corStatusNC(n.status)}">${n.status}</span>
     <div class="spacer"></div>
     <span class="num" style="font-size:12.5px;color:${pz.cor};font-weight:600">Prazo ${fmt(n.prazo)} · ${pz.txt}</span></div>
    <div style="font-weight:600;line-height:1.5">${esc(n.descricao)}</div>
    <div style="font-size:12.3px;color:var(--muted);margin-top:5px">Requisito: ${esc(n.item)} · Responsável: ${esc(n.responsavel)}</div>
    ${n.observacao?`<div style="font-size:12.5px;margin-top:8px"><b>Observação:</b> ${esc(n.observacao)}</div>`:''}
    ${n.evidencia?`<div style="margin-top:12px"><div class="eyebrow" style="margin-bottom:6px">Evidência do apontamento</div>
      <img class="evid" style="max-height:200px" src="${n.evidencia}" alt="Evidência"></div>`:''}
    ${n.plano?`<div style="margin-top:14px;padding-top:12px;border-top:1px dashed var(--line)">
      <div class="eyebrow" style="margin-bottom:7px">Plano de ação</div>
      <div style="font-size:13px;margin-bottom:6px"><b>Causa:</b> ${esc(n.plano.causa||'—')}</div>
      <div style="font-size:13px;margin-bottom:6px"><b>Ação corretiva:</b> ${esc(n.plano.acao||'—')}</div>
      <div style="font-size:12.5px;color:var(--muted)">Responsável: ${esc(n.plano.responsavel)} · Prazo: ${fmt(n.plano.prazo)}</div>
      ${n.plano.evidencia?`<div style="margin-top:10px"><div class="eyebrow" style="margin-bottom:6px">Evidência da ação</div>
        <img class="evid" style="max-height:200px" src="${n.plano.evidencia}" alt="Evidência da ação"></div>`:''}
     </div>`:`<div style="margin-top:12px;font-size:12.5px;color:var(--muted)">Plano de ação ainda não registrado pelo gestor.</div>`}
    ${(n.historico||[]).length?`<div style="margin-top:12px;font-size:11.8px;color:var(--muted2)">
      ${n.historico.map(h=>`${esc(h.acao)} — ${esc(h.quem)}, ${fmtDT(h.quando)}`).join(' · ')}</div>`:''}
   </div>`}).join('')
  :`<div style="background:var(--canvas);border-radius:10px;padding:16px;font-size:13px;color:#3B4557;margin-bottom:20px">
    Nenhuma não conformidade foi registrada nesta auditoria.</div>`}

  <div class="eyebrow" style="margin:22px 0 9px">3. Conclusão</div>
  <div style="font-size:13.4px;line-height:1.65;color:#3B4557">
   A auditoria ${esc(a.tipo).toLowerCase()} realizada no setor ${esc(a.setor)} da ${esc(a.unidade)} em ${fmt(a.data)}
   avaliou ${r.total} itens, dos quais ${r.aplicaveis} entraram na base de cálculo.
   O resultado obtido foi de <b style="color:${f.cor}">${n1(r.pct)}%</b>, classificado como <b>${f.label}</b>.
   Foram registradas ${r.nc} não conformidade${r.nc===1?'':'s'} e ${r.om} oportunidade${r.om===1?'':'s'} de melhoria.
   ${r.nc?`O tratamento das não conformidades é de responsabilidade dos gestores indicados e só será encerrado após validação da Qualidade.`:''}
  </div>

  <div style="display:grid;grid-template-columns:1fr 1fr;gap:40px;margin-top:48px">
   ${[['Auditor responsável',a.auditor],['Qualidade',' ']].map(([k,v])=>`
    <div style="text-align:center"><div style="border-top:1px solid var(--ink);padding-top:7px;font-size:12.5px">
     <b>${esc(v)}</b><div style="color:var(--muted);font-size:11.5px">${k}</div></div></div>`).join('')}
  </div>
 </div></div>`;
}

/* =========================================================
   NOTIFICAÇÕES / MODAIS
   ========================================================= */
function toggleNotif(){ NOTIF_OPEN=!NOTIF_OPEN; renderNotif() }
function renderNotif(){
 const l=minhasNotif(), nl=l.filter(x=>!x.lida).length;
 $('#bellCount').outerHTML = nl?`<b id="bellCount">${nl}</b>`:`<span id="bellCount"></span>`;
 $('#notifPanel').innerHTML = NOTIF_OPEN?`
  <div class="notif">
   <div class="nh"><h4>Notificações</h4><span style="font-size:11.5px;color:var(--muted)">${esc(pessoaAtual()||perfilAtual())}</span>
    <div class="spacer"></div>
    ${nl?`<button class="btn btn-s btn-sm" onclick="lerTodas()">Marcar lidas</button>`:''}
    <button class="x" onclick="toggleNotif()">×</button></div>
   <div class="lst">
    ${l.length?l.slice(0,25).map(x=>`<div class="it ${x.lida?'':'un'}" onclick="abrirNotif('${x.id}')">
      <div class="t1">${esc(x.titulo)}</div><div class="t2" style="white-space:pre-line">${esc(x.texto)}</div>
      <div class="t3">${fmtDT(x.quando)}</div></div>`).join('')
    :`<div class="empty" style="padding:30px"><p>Nenhuma notificação</p><span>Você será avisado quando houver movimentação.</span></div>`}
   </div></div>`:'';
}
function lerTodas(){ minhasNotif().forEach(x=>x.lida=true); save(); renderNotif() }
function abrirNotif(id){
 const x=S.notificacoes.find(n=>n.id===id); if(!x) return;
 x.lida=true; save(); NOTIF_OPEN=false;
 if(x.link) go(x.link.n,x.link.p); else renderNotif();
}
document.addEventListener('click',e=>{
 if(NOTIF_OPEN&&!e.target.closest('.notif')&&!e.target.closest('.bell')){ NOTIF_OPEN=false; renderNotif() }
});

function modal(titulo,corpo,rodape){
 $('#modalHost').innerHTML=`<div class="modal-bg" onclick="if(event.target===this)fecharModal()">
  <div class="modal"><div class="mh"><h3>${esc(titulo)}</h3><button class="x" onclick="fecharModal()">×</button></div>
   <div class="mb">${corpo}</div><div class="mf">${rodape}</div></div></div>`;
}
function fecharModal(){ $('#modalHost').innerHTML='' }
function confirmar(titulo,texto,cb,rotulo,classe){
 window._cb=cb;
 modal(titulo,`<p style="margin:0;line-height:1.6;color:#4B5563">${esc(texto)}</p>`,
  `<button class="btn btn-s" onclick="fecharModal()">Cancelar</button>
   <button class="btn ${classe||'btn-p'}" onclick="(window._cb||function(){})();fecharModal()">${rotulo||'Confirmar'}</button>`);
}
document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ fecharModal(); if(NOTIF_OPEN){NOTIF_OPEN=false;renderNotif()} } });

/* =========================================================
   INÍCIO
   ========================================================= */
load();
if(SBCOL){ document.body.classList.add('sb-collapsed'); $('#sbBtn').textContent='»'; $('#sbBtn').title='Expandir menu' }
if(!S.plano) S.plano=[];
if(restaurarSessao()){ render() } else { telaLogin() }
</script>
</body>
